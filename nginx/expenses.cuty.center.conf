# expenses.cuty.center — Cuty Accounting (cuty-expenses-proxy on cuty-platform Docker network)
# Installed to cuty-platform nginx/conf.d/ by upload-and-deploy.ps1
# Cuty main nginx keeps 80/443; this stack must NOT bind those ports.

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name expenses.cuty.center;

    client_max_body_size 25M;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        set $expenses_backend "http://cuty-expenses-proxy:80";
        proxy_pass $expenses_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
